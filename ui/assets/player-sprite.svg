<svg xmlns="http://www.w3.org/2000/svg" width="256" height="192" viewBox="0 0 256 192">
  <defs>
    <style>
      .skin{fill:#e6d8c8}
      .line{fill:#111827}
      .hair{fill:#b9e6ff}
      .coat{fill:#f8fafc}
      .coatShade{fill:#d8e1ec}
      .shirt{fill:#98dde0}
      .pant{fill:#8c7646}
      .pantShade{fill:#6f5f3c}
      .shoe{fill:#242733}
      .belt{fill:#5b3c22}
      .buckle{fill:#facc15}
      .portal{fill:#99f6e4}
