      <rect x="25" y="13" width="12" height="1.2" class="line"/>
      <rect x="27" y="14.5" width="2.1" height="1.2" class="line"/>
      <rect x="33" y="14.5" width="2.1" height="1.2" class="line"/>
      <rect x="29.8" y="16" width="1.2" height="3.2" class="line"/>
      <rect x="26.8" y="19.5" width="8" height="1" class="line"/>
      <rect x="24" y="17.2" width="1.4" height="3" class="line"/>
