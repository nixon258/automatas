      <rect x="34" y="46" width="4" height="14" rx="1" class="pant" transform="rotate(-12 36 46)"/>
      <rect x="24" y="59" width="6" height="2" rx="1" class="shoe"/>
      <rect x="34" y="59" width="6" height="2" rx="1" class="shoe"/>
    </g>

    <g id="legsW2">
