      <rect x="26" y="43.8" width="11" height="2.2" class="belt"/>
      <rect x="30.1" y="43.8" width="2.8" height="2.2" class="buckle"/>
      <path d="M25 54 L27 62 L29 54 Z" class="coat"/>
      <path d="M37 54 L35 62 L33 54 Z" class="coat"/>
    </g>

    <g id="legsA">
